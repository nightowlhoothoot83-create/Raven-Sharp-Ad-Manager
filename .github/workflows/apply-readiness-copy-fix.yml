name: Apply Ad Manager readiness copy fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-readiness-copy-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale prototype and Railway setup wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'Stripe Checkout opens only after your Railway variables are configured.':'Sign in to choose a paid plan. Checkout is handled securely by Stripe.',
            '<li>Local prototype storage</li>':'<li>Saved campaign workspace</li>',
            "showToast('Free prototype mode is already active.')":"showToast('Free plan is already active.')",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit copy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix: align Ad Manager public readiness copy with current backend"
          git push
